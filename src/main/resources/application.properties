spring.application.name=autoloc-api
server.port=8081

spring.datasource.url=jdbc:mariadb://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${AUTOLOC_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO

autoloc.manager.token=${AUTOLOC_MANAGER_TOKEN:}
